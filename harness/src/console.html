<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness console</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --dim: #77736b; --line: #e4e1da;
  --in: #ffffff; --out: #dff5d8; --tool: #eef2fb; --warn: #fdecea; --note: #f4f1e8; --accent: #2f6f4f;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141412; --panel: #1d1c1a; --ink: #ecebe6; --dim: #9a968d; --line: #2e2d29;
    --in: #25241f; --out: #1f3a26; --tool: #1d2433; --warn: #3a1f1d; --note: #26241d; --accent: #7cc49b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, system-ui, sans-serif; }
.app { display: grid; grid-template-columns: 280px 1fr; height: 100dvh; }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
aside h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.mode { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--note); color: var(--dim); }
.convo { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.convo:hover, .convo.on { background: var(--note); }
.convo b { display: block; }
.convo small { color: var(--dim); }
.badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; margin-left: 4px; background: var(--tool); color: var(--dim); }
.badge.pending { background: #f6e3b4; color: #6b4f00; } .badge.denied { background: var(--warn); }
main { display: flex; flex-direction: column; min-width: 0; }
header { padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
header .title { font-weight: 600; flex: 1; min-width: 0; }
header label { color: var(--dim); font-size: 12px; display: flex; gap: 4px; align-items: center; }
#tl { flex: 1; overflow-y: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 8px; }
.e { max-width: 820px; border-radius: 10px; padding: 8px 12px; border: 1px solid var(--line); word-wrap: break-word; }
.e .k { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 10px; margin-bottom: 3px; }
.in { background: var(--in); align-self: flex-start; }
.out { background: var(--out); align-self: flex-end; border: 2px solid var(--accent); box-shadow: 0 1px 0 rgba(0,0,0,.05); }
.out .k span:first-child { color: var(--accent); font-weight: 700; letter-spacing: .02em; }
.out img { display: block; max-width: 220px; border-radius: 8px; margin: 4px 0 6px; }
.out.auto { border-style: dashed; }
.tool, .search, .command { background: var(--tool); font-size: 13px; }
.refused, .fail { background: var(--warn); }
.note, .commentary { background: var(--note); color: var(--dim); font-style: italic; }
.line { border: none; padding: 0 4px; color: var(--dim); font-size: 12px; align-self: center; }
pre { font: 12px/1.4 var(--mono); white-space: pre-wrap; margin: 4px 0 0; max-height: 260px; overflow: auto; }
details summary { cursor: pointer; color: var(--dim); font-size: 12px; }
.msg { white-space: pre-wrap; }
form { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
input, textarea, select, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { flex: 1; min-width: 200px; resize: none; height: 42px; }
button { background: var(--accent); color: #fff; border: none; font-weight: 600; cursor: pointer; }
.who { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
.who input { width: 150px; }
table { border-collapse: collapse; font-size: 12px; width: 100%; }
td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.empty { color: var(--dim); margin: auto; text-align: center; }
.back { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .app.open aside { display: none; } .app:not(.open) main { display: none; }
  .back { display: inline-block; background: none; color: var(--accent); padding: 0 6px 0 0; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <h1>Harness <span class="mode" id="mode">…</span></h1>
    <div class="convo" data-view="state"><b>State</b><small>people, requests, owed updates</small></div>
    <div class="convo" data-view="new"><b>+ New test guest</b><small>talk to Milo as someone new</small></div>
    <div id="list"></div>
  </aside>
  <main>
    <header>
      <button class="back" onclick="app.classList.remove('open')">‹</button>
      <span class="title" id="title">Pick a conversation</span>
      <label><input type="checkbox" id="showTools" checked> tools &amp; notes</label>
      <label title="Only what actually reached their phone, and what they sent"><input type="checkbox" id="onlyWa"> WhatsApp only</label>
    </header>
    <div id="tl"><div class="empty">Every conversation, in full: what each agent saw, the tools it called, what it kept to itself, and what was actually sent.</div></div>
    <form id="f" hidden>
      <div class="who" id="who"></div>
      <textarea id="text" placeholder="Message…"></textarea>
      <button>Send</button>
    </form>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
let cur = null, since = 0, testMode = false, owner = "", timer = null;
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const time = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const pretty = (v) => typeof v === "string" ? v : JSON.stringify(v, null, 2);
function tryJson(s) { try { return JSON.parse(s); } catch { return s; } }

async function loadList() {
  const r = await (await fetch("api/convos")).json();
  testMode = r.testMode; owner = r.owner;
  $("#mode").textContent = r.testMode ? "TEST" : "LIVE";
  $("#list").innerHTML = r.convos.map((c) => {
    const p = c.person, name = c.agent === "thor" ? "Thor" : c.agent === "media" ? "Media: " + c.key : (c.key === owner ? "Tom (you)" : p?.name || "+" + c.key);
    const badge = p && p.status !== "approved" ? `<span class="badge ${p.status}">${p.status}</span>` : c.agent !== "milo" ? `<span class="badge">${c.agent}</span>` : "";
    return `<div class="convo ${cur && cur.agent === c.agent && cur.key === c.key ? "on" : ""}" data-agent="${c.agent}" data-key="${esc(c.key)}"><b>${esc(name)}${badge}</b><small>${c.agent === "milo" && c.key !== owner ? "+" + esc(c.key) + " · " : ""}${c.n} events · ${time(c.last_at)}</small></div>`;
  }).join("") + (r.convos.some((c) => c.agent === "thor") ? "" : `<div class="convo" data-agent="thor" data-key="tom"><b>Thor<span class="badge">thor</span></b><small>no messages yet</small></div>`);
}

function render(e) {
  const d = e.data, k = (label, extra = "") => `<div class="k"><span>${label}</span><span>${extra}${time(e.at)}</span></div>`;
  switch (e.kind) {
    case "in": {
      const lines = d.text.split("\n"), head = [], body = [];
      for (const l of lines) (body.length === 0 && /^\[/.test(l) ? head : body).push(l);
      const msg = body.join("\n").trim();
      return `<div class="e in">${k("in")}${head.length ? `<details><summary>header the agent saw</summary><pre>${esc(head.join("\n"))}</pre></details>` : ""}<div class="msg">${esc(msg)}</div></div>`;
    }
    case "out": return `<div class="e out ${d.harness ? "auto" : ""}">${k(d.harness ? "📤 WhatsApp · automatic, from the harness" : d.image ? "📤 WhatsApp · poster" : "📤 WhatsApp · Milo")}${d.image ? `<img src="${esc(d.image)}" alt="poster" loading="lazy">` : ""}<div class="msg">${esc(d.text)}</div></div>`;
    case "tool":
      // send_message / show_poster are how things reach the phone; the green
      // bubble right before this is what actually went out.
      if (d.tool === "send_message" || d.tool === "show_poster") return `<div class="e tool" data-t>${k("🔧 " + esc(d.tool) + " → " + esc(d.result), "")}</div>`;
      return `<div class="e tool" data-t>${k("🔧 " + esc(d.tool), d.success ? "" : "✗ ")}<pre>${esc(pretty(d.args))}</pre><details ${String(d.result).length < 400 ? "open" : ""}><summary>result · ${d.ms}ms</summary><pre>${esc(pretty(tryJson(d.result)))}</pre></details></div>`;
    case "web_search": return `<div class="e search" data-t>${k("🔎 web search")}${esc(d.query)}</div>`;
    case "command": return `<div class="e command" data-t>${k("$ command", "exit " + d.exitCode + " · ")}<pre>${esc(d.command)}</pre><details><summary>output</summary><pre>${esc(d.output)}</pre></details></div>`;
    case "file_change": return `<div class="e command" data-t>${k("✎ files changed")}<pre>${esc(d.changes.join("\n"))}</pre></div>`;
    case "commentary": return `<div class="e commentary" data-t>${k("thinking out loud (not sent)")}<div class="msg">${esc(d.text)}</div></div>`;
    case "refused": return `<div class="e refused">${k("⛔ refused before sending: mentions “" + esc(d.matched) + "”")}<div class="msg">${esc(d.text)}</div></div>`;
    case "turn": {
      const notes = (d.final || []).length ? `<div class="e note" data-t>${k("🔒 final reply text: private, never sent")}<div class="msg">${esc(d.final.join("\n\n"))}</div></div>` : "";
      const ctx = d.context ? ` · context ${Math.round(d.context.used / 1000)}k${d.context.window ? " of " + Math.round(d.context.window / 1000) + "k" : ""}` : "";
      const line = d.ok ? `<div class="e line" data-t>turn done · ${(d.ms / 1000).toFixed(1)}s${ctx}</div>` : `<div class="e fail">${k("✗ turn failed: " + esc(d.failure))}<pre>${esc(d.detail || "")}</pre></div>`;
      return notes + line;
    }
    case "nudge": return `<div class="e line">nudged: turn ended without sending anything</div>`;
    case "held": return `<div class="e in">${k("held · not approved yet, no model saw this")}<div class="msg">${esc(d.text)}</div></div>`;
    case "approved": return `<div class="e line">✓ approved by Tom</div>`;
    case "denied": return `<div class="e line">✗ denied by Tom</div>`;
    case "thread": return `<div class="e line" data-t>new Codex thread ${esc(d.id).slice(0, 8)}${d.reason ? " (" + esc(d.reason) + ")" : ""}</div>`;
    default: return `<div class="e line" data-t>${esc(e.kind)} ${esc(pretty(d))}</div>`;
  }
}

async function poll() {
  if (!cur) return;
  const tl = $("#tl"), atBottom = tl.scrollHeight - tl.scrollTop - tl.clientHeight < 80;
  const rows = await (await fetch(`api/trace?agent=${cur.agent}&key=${encodeURIComponent(cur.key)}&since=${since}`)).json();
  if (!rows.length) return;
  if (since === 0) tl.innerHTML = "";
  tl.insertAdjacentHTML("beforeend", rows.map(render).join(""));
  since = rows.at(-1).id;
  applyFilter();
  if (atBottom || rows.length > 50) tl.scrollTop = tl.scrollHeight;
}

function applyFilter() {
  const wa = $("#onlyWa").checked;
  document.querySelectorAll("#tl .e").forEach((el) => {
    const machinery = el.hasAttribute("data-t");
    const onPhone = el.classList.contains("out") || el.classList.contains("in");
    el.style.display = wa ? (onPhone ? "" : "none") : machinery && !$("#showTools").checked ? "none" : "";
  });
}
$("#showTools").onchange = applyFilter;
$("#onlyWa").onchange = applyFilter;

function composer() {
  const f = $("#f"), who = $("#who");
  if (cur?.agent === "thor") { f.hidden = false; who.innerHTML = `<small style="color:var(--dim)">to Thor, as Tom</small>`; return; }
  if (!testMode || cur?.agent !== "milo") { f.hidden = true; return; }
  f.hidden = false;
  who.innerHTML = cur.key === "new"
    ? `<input id="num" placeholder="number e.g. 447700900123" value="4477009${Math.floor(10000 + Math.random() * 89999)}"><input id="nm" placeholder="WhatsApp name">`
    : `<small style="color:var(--dim)">as ${cur.key === owner ? "Tom" : "+" + esc(cur.key)} (pretend WhatsApp)</small>`;
}

async function open(agent, key, title) {
  cur = { agent, key }; since = 0;
  $("#title").textContent = title; app.classList.add("open");
  $("#tl").innerHTML = key === "new" ? `<div class="empty">Message Milo as a brand-new number. You'll see the holding reply here, and the approval request in <b>Tom (you)</b>.</div>` : `<div class="empty">Nothing yet.</div>`;
  composer(); loadList(); poll();
}

async function showState() {
  cur = null; $("#f").hidden = true; $("#title").textContent = "State"; app.classList.add("open");
  const s = await (await fetch("api/state")).json();
  const table = (rows, cols) => rows.length ? `<table><tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr>${rows.map((r) => `<tr>${cols.map((c) => `<td>${esc(c.endsWith("_at") && r[c] ? new Date(r[c]).toLocaleString() : r[c])}</td>`).join("")}</tr>`).join("")}</table>` : `<p class="empty">none</p>`;
  $("#tl").innerHTML = `<h3>People</h3>${table(s.people, ["number", "name", "status", "notes"])}<h3>Requests</h3>${table(s.jobs, ["title", "season", "number", "state", "told_state", "created_at"])}<h3>Updates owed</h3>${table(s.notifications, ["job_id", "state", "attempts", "delivered_at"])}`;
}

document.querySelector("aside").onclick = (ev) => {
  const c = ev.target.closest(".convo"); if (!c) return;
  if (c.dataset.view === "state") return showState();
  if (c.dataset.view === "new") return open("milo", "new", "New test guest");
  open(c.dataset.agent, c.dataset.key, c.querySelector("b").textContent);
};

$("#f").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("#text").value.trim(); if (!text) return;
  let body;
  if (cur.agent === "thor") body = { agent: "thor", text };
  else if (cur.key === "new") {
    const number = $("#num").value.replace(/\D/g, ""), name = $("#nm").value;
    body = { agent: "milo", number, name, text };
    $("#text").value = ""; await fetch("api/say", { method: "POST", body: JSON.stringify(body) });
    return open("milo", number, name || "+" + number);
  } else body = { agent: "milo", number: cur.key, text };
  $("#text").value = "";
  const r = await fetch("api/say", { method: "POST", body: JSON.stringify(body) });
  if (!r.ok) alert((await r.json()).error);
};
$("#text").onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("#f").requestSubmit(); } };

loadList();
setInterval(() => { poll(); if (!cur || cur.key !== "new") loadList(); }, 1500);
</script>
</body>
</html>

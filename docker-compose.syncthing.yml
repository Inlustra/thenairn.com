services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    labels:
      plugsy.name: "Syncthing"
      plugsy.category: "Home"
      plugsy.icon: "@styled-icons/feather/RefreshCw"
      plugsy.link: https://sync.thenairn.com
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
    volumes:
      - ${CONFIG_DIR}/syncthing:/config
      - ${GAMES_DIR}/saves:/saves
    ports:
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped

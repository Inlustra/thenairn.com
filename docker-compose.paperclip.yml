services:
  # Dedicated Postgres. Deliberately NOT shared with hindsight-db /
  # clawmander-postgres / immich_postgres: Paperclip is the board this business
  # runs on, and its data should not inherit another app's upgrade, restart or
  # backup lifecycle.
  paperclip-postgres:
    container_name: paperclip-postgres
    image: postgres:16-alpine
    labels:
      plugsy.name: "Paperclip DB"
      plugsy.category: "Infrastructure"
      plugsy.parents: "Paperclip"
      plugsy.icon: "@styled-icons/feather/Database"
    environment:
      - POSTGRES_USER=paperclip
      - POSTGRES_DB=paperclip
      - POSTGRES_PASSWORD=${PAPERCLIP_DB_PASSWORD}
    volumes:
      - /mnt/cache/Config/paperclip-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  paperclip:
    container_name: paperclip
    labels:
      plugsy.name: "Paperclip"
      plugsy.category: "Code"
      plugsy.icon: "@styled-icons/feather/Clipboard"
      plugsy.link: https://rainn.thenairn.com
    build:
      context: ./paperclip
    depends_on:
      paperclip-postgres:
        condition: service_healthy
    environment:
      - HOME=/root
      - DATABASE_URL=postgres://paperclip:${PAPERCLIP_DB_PASSWORD}@paperclip-postgres:5432/paperclip
      # The base URL agent runs are told to call (RAI-8). Left unset, the server
      # derives it from server.allowedHostnames in config.json and hands every
      # agent `http://rainn.thenairn.com:3100`, which does not resolve to
      # anything reachable from inside this container - that name is the LAN
      # address 192.168.96.14 and nothing binds host port 3100, deliberately
      # (see the "No host port binding" note below). The advertised fallback,
      # the container's own bridge IP, is then refused 403 by the hostname
      # allowlist. So the documented path had no working URL and every agent
      # burned its opening tool calls rediscovering loopback.
      #
      # localhost is the right answer while the agents share this container's
      # network namespace with the server, and it is stable: the hostname guard
      # hardcodes localhost/127.0.0.1/::1 into its allow set regardless of
      # config (server/dist/middleware/private-hostname-guard.js). This value
      # also becomes the first entry in PAPERCLIP_RUNTIME_API_CANDIDATES_JSON,
      # so the fallback list starts with something that works.
      #
      # If the API ever moves off this container, this must change with it.
      - PAPERCLIP_API_URL=http://localhost:3100
      # Docker client config. The compose plugin ships in HQ rather than the
      # image (same reasoning as gh in entrypoint.sh: one copy, no rebuild to
      # bump it), and the CLI only finds plugins under $DOCKER_CONFIG.
      - DOCKER_CONFIG=/mnt/user/HQ/.docker
      # Prepend HQ/tools so `docker` - and, as a side effect, the `op` and `gh`
      # that already live there - resolve without a symlink. The rest of this
      # value is node:22's stock PATH verbatim; do not drop entries, Node
      # itself is in /usr/local/bin.
      - PATH=/mnt/user/HQ/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      # Instance state: config, secrets key, local storage, logs.
      - /mnt/cache/Config/paperclip:/root/.paperclip
      # Shared Claude login. Mounted at the RESOLVED path rather than via the
      # host's /root/.claude symlink, which lives in tmpfs and is recreated by
      # the array-start user script - this way the container does not depend on
      # that script having run.
      - /mnt/user/HQ/.claude:/root/.claude
      # GitHub access via the gh token only - deliberately NOT the host's SSH
      # private key. A scoped token is the smaller blast radius, and git can
      # reach the same repos over HTTPS using gh as the credential helper.
      - /mnt/user/HQ/.gh:/root/.config/gh
      - /mnt/user/HQ/.gitconfig:/root/.gitconfig-host:ro
      # Repos the agents work on.
      - /mnt/cache/HQ:/mnt/cache/HQ
      # Project source (~35 repos, mostly dormant). Read-only: per HQ's own
      # CLAUDE.md this is "archaeology, not operations", so agents should be
      # able to read it for discovery without being able to rewrite history.
      # Drop the :ro when something actually needs to operate here.
      - /mnt/user/Internal:/mnt/user/Internal:ro
      # HQ at its canonical path. Everything - CLAUDE.md, the agent configs,
      # every Cog memory reference - addresses HQ as /mnt/user/HQ, so without
      # this the agents break on paths that look correct. Bound from the cache
      # path rather than the shfs view because HQ is a cache-only share
      # (shareUseCache="only"), so /mnt/cache/HQ is authoritative and the mover
      # will never relocate it - the same optimisation orca uses for
      # thenairn.com, and it skips the shfs layer.
      - /mnt/cache/HQ:/mnt/user/HQ
      # The host Docker daemon. Granted by Thomas on RAI-25 (interaction
      # `rai25-infra-access-path`, 2026-08-22) so the infra agent can actually
      # run the bring-up in up.sh instead of only writing it. He was offered
      # SSH and declined it: this is Docker, and nothing else.
      #
      # NOT :ro, deliberately. A read-only bind mount does not make the Docker
      # API read-only - connect(2) on a unix socket is an inode permission
      # check, not a filesystem write, so `:ro` still permits container create,
      # start, stop and delete. All it actually prevents is unlinking the
      # socket file. `plugsy` and `orca` both mount it rw for the same reason.
      # Writing `:ro` here would buy nothing and would leave a misleading
      # "paperclip has read-only Docker" signal in a public repo.
      #
      # Blast radius, stated once: this is root-equivalent on Tower. Anything
      # that can reach the daemon can start a privileged container and mount
      # the host filesystem. That is inherent to the socket, not to this line.
      - /var/run/docker.sock:/var/run/docker.sock
    # No host port binding: Caddy reaches it as paperclip:3100 on
    # thenairncom_default, the same way it reaches orca:6768.
    restart: unless-stopped

# Hindsight — agent memory server (trial deployment)
#
# API:  http://<host>:8890   (remapped from 8888 — gluetun already holds 8888)
# UI:   http://<host>:9999   (Control Plane)
# MCP:  http://<host>:8890/mcp
#
# Runs fully local: llama.cpp sidecar for LLM extraction, local ONNX embeddings.
# No API key required, nothing leaves the box.
#
# Deliberately uses EXTERNAL Postgres rather than the bundled embedded `pg0`:
# upstream issue #675 lost all data on a docker restart with pg0.
#
# Env lives in .env.hindsight
#   docker compose -p thenairncom -f docker-compose.hindsight.yml --env-file .env.hindsight up -d

services:
  hindsight-db:
    image: pgvector/pgvector:pg18
    container_name: hindsight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HINDSIGHT_DB_USER:-hindsight_user}
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD in .env.hindsight}
      POSTGRES_DB: ${HINDSIGHT_DB_NAME:-hindsight_db}
    volumes:
      - hindsight_pg:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HINDSIGHT_DB_USER:-hindsight_user} -d ${HINDSIGHT_DB_NAME:-hindsight_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hindsight-net

  # NOTE: extraction previously ran on a local llama.cpp sidecar (gemma-4-E2B on
  # the GTX 1660). Removed 2026-08-02: a 2B model was ~81s/document AND produced
  # malformed JSON, which is the failure mode hindsight's docs warn about for
  # weak self-hosted models. OpenRouter is faster, better, and ~2p for the whole
  # corpus. Embeddings remain local ONNX (BAAI/bge-small-en-v1.5) — no API key,
  # nothing embedded off-box. The llama service is recoverable from git history.

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION:-latest}
    container_name: hindsight
    restart: unless-stopped
    ports:
      - "8890:8888"   # API + MCP
      - "9999:9999"   # Control Plane UI
    environment:
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: "8888"
      HINDSIGHT_API_DATABASE_URL: postgresql://${HINDSIGHT_DB_USER:-hindsight_user}:${HINDSIGHT_DB_PASSWORD}@hindsight-db:5432/${HINDSIGHT_DB_NAME:-hindsight_db}
      # LLM extraction via OpenRouter (OpenAI-compatible).
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: https://openrouter.ai/api/v1
      HINDSIGHT_API_LLM_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env.hindsight}
      # deepseek-v4-flash supports `structured_outputs` (enforced schema-constrained
      # decoding), not just `response_format`. That matters: the local 2B model
      # failed extraction with a JSONDecodeError, and STRICT_SCHEMA below relies
      # on the strict path. Date-pinned rather than `-latest` so it can't shift.
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-deepseek/deepseek-v4-flash-0731}
      HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
      # Cap reasoning. Extraction is retrieval-plus-transpilation — the facts are
      # already in the text — and every source measured says extended reasoning
      # costs 3.7x the output tokens for ~0 quality, while risking empty output
      # on long prompts. hindsight's code already defaults this to "low" and
      # injects it for DeepSeek specifically; set explicitly so it can't drift.
      HINDSIGHT_API_LLM_REASONING_EFFORT: low
      # Pin the worker id so in-flight tasks aren't orphaned on restart
      # (upstream advises this explicitly).
      HINDSIGHT_API_WORKER_ID: hindsight-1
    depends_on:
      hindsight-db:
        condition: service_healthy
    networks:
      - hindsight-net

networks:
  hindsight-net:
    driver: bridge

volumes:
  hindsight_pg:

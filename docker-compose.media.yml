services:
  # VPN PROXY - All torrent traffic routes through here
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${MULLVAD_WIREGUARD_ADDRESSES}
      - FIREWALL_VPN_INPUT_PORTS=51413
      - FIREWALL_INPUT_PORTS=9091
      - HTTPPROXY=on
      - SERVER_CITIES=Zurich  # Change to your preferred Mullvad location
      - TZ=Europe/Paris
      - LOG_LEVEL=info
      - DOT=off
      - DNS_ADDRESS=1.1.1.1
    ports:
      # Transmission ports (now exposed via gluetun)
      - 51413:51413/tcp      # Transmission peer port
      - 51413:51413/udp      # Transmission peer port
      # Gluetun control/proxy ports (optional)
      - 8888:8888/tcp        # HTTP proxy
      - 8388:8388/tcp        # Shadowsocks
      - 8388:8388/udp        # Shadowsocks
    restart: unless-stopped

  plex:
    runtime: nvidia
    container_name: plex
    labels:
      plugsy.name: "Plex"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/simple-icons/Plex"
      plugsy.link: https://plex.thenairn.com
    image: plexinc/pms-docker:latest
    hostname: Artemis
    logging:
        driver: "json-file"
        options:
            max-size: "3m"
    environment:
      - TZ=Europe/Paris
      # - PLEX_CLAIM=${PLEX_CLAIM}
      - ADVERTISE_IP=${PLEX_ADVERTISE_IP}
      - NVIDIA_VISIBLE_DEVICES=GPU-c1d14a88-b2fa-5786-e47d-64af7a34ea34
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PLEX_UID=0
      - PLEX_GID=0
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    volumes:
      - /tmp:/transcode
      - ${CONFIG_DIR}/plex:/config
      - ${AMEDIA_DIR}/A:/data/ashows
      - ${MEDIA_DIR}/Shows:/data/shows
      - ${MEDIA_DIR}/Movies:/data/movies
      - ${MEDIA_DIR}/Anime:/data/anime
      - ${MEDIA_DIR}/AnimeMovies:/data/animemovies
      - ${MEDIA_DIR}/Audiobooks:/data/audiobooks
      - ${PERSONAL_MEDIA_DIR}/:/data/personal
    restart: unless-stopped

  # TORRENT CLIENT - Now routes through gluetun VPN
  transmission:
    container_name: transmission
    image: linuxserver/transmission:latest
    network_mode: "service:gluetun"  # All traffic goes through gluetun VPN
    sysctls:
      - "net.ipv6.conf.all.disable_ipv6=0"
    volumes:
      - ${DOWNLOADS_DIR}/incomplete:/data/downloads
      - ${DOWNLOADS_DIR}/completed:/data/completed
      - ${CONFIG_DIR}/transmission:/config
      - ${DOWNLOADS_DIR}:/data
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Paris
      - TRANSMISSION_WEB_UI=/flood-for-transmission  # Preserves flood UI
      # Removed: All OPENVPN_* vars (VPN now handled by gluetun)
      # Removed: WEBPROXY_* vars (not needed)
    depends_on:
      - gluetun
    restart: always

  sonarr:
    container_name: sonarr
    labels:
      plugsy.name: "Sonarr"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/feather/Tv"
      plugsy.link: https://sonarr.thenairn.com
    image: linuxserver/sonarr:latest
    depends_on:
      - transmission
    links:
      - plex
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${MEDIA_DIR}/Shows:/tv
      - ${AMEDIA_DIR}/A:/amedia
      - ${DOWNLOADS_DIR}:/data
    environment:
      - PGID=0
      - PUID=0
      - TZ=Europe/Paris
    restart: unless-stopped

  animesonarr:
    container_name: animesonarr
    labels:
      plugsy.name: "Anime Sonarr"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/feather/Tv"
      plugsy.link: https://animesonarr.thenairn.com
    image: linuxserver/sonarr:develop
    depends_on:
      - transmission
    links:
      - plex
    volumes:
      - ${CONFIG_DIR}/sonarr_anime:/config
      - ${MEDIA_DIR}/Anime:/anime
      - ${AMEDIA_DIR}/A:/amedia
      - ${DOWNLOADS_DIR}:/data
    environment:
      - PGID=0
      - PUID=0
      - TZ=Europe/Paris
    restart: unless-stopped

  radarr:
    container_name: radarr
    labels:
      plugsy.name: "Radarr"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/feather/Film"
      plugsy.link: https://radarr.thenairn.com
    image: linuxserver/radarr
    depends_on:
      - transmission
    links:
      - plex
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${MEDIA_DIR}/Movies:/movies
      - ${MEDIA_DIR}/Anime:/anime
      - ${DOWNLOADS_DIR}:/data
    environment:
      - PGID=0
      - PUID=0
      - TZ=Europe/Paris
    restart: unless-stopped
  
  animeradarr:
    container_name: animeradarr
    labels:
      plugsy.name: "Anime Radarr"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/feather/Film"
      plugsy.link: https://animeradarr.thenairn.com
    image: linuxserver/radarr
    depends_on:
      - transmission
    links:
      - plex
    volumes:
      - ${CONFIG_DIR}/animeradarr:/config
      - ${MEDIA_DIR}/AnimeMovies:/movies
      - ${DOWNLOADS_DIR}:/data
    environment:
      - PGID=0
      - PUID=0
      - TZ=Europe/Paris
    restart: unless-stopped

  # overseerr replaced by seerr (merged Overseerr+Jellyseerr successor) 2026-08-01.
  # Overseerr upstream archived; config migrated to ${CONFIG_DIR}/seerr. Original
  # ${CONFIG_DIR}/overseer + stopped `overseerr` container retained as rollback.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - TZ=Europe/Paris
      - LOG_LEVEL=info
    volumes:
      - ${CONFIG_DIR}/seerr:/app/config
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/linuxserver/prowlarr:develop
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    labels:
      plugsy.name: "Prowlarr"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/fluentui-system-filled/GlobeSearch"
      plugsy.link: https://prowlarr.thenairn.com
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    restart: unless-stopped
    links:
      - sonarr
      - radarr
      - transmission
    
  # CAPTCHA SOLVER — Byparr (FlareSolverr-API-compatible, but uses undetected-chromedriver
  # which currently beats Cloudflare where FlareSolverr 3.5.0 can't pass cookies properly).
  # Listens on 8191 inside the gluetun network namespace — Prowlarr hits http://gluetun:8191/v1.
  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=Europe/London
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: 0:0
    volumes:
      - ./recyclarr:/config
    environment:
      - TZ=Europe/Paris

  plex-meta-manager:
    image: lscr.io/linuxserver/kometa:latest
    container_name: kometa
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - PMM_CONFIG=/config/config.yml #optional
      - PMM_TIME=03:00 #optional
      - PMM_RUN=TRUE #optional
      - PMM_TEST=False #optional
      - PMM_NO_MISSING=False #optional
    volumes:
      - ${CONFIG_DIR}/plex-meta-manager:/config
    restart: unless-stopped

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:preview
    container_name: suwayomi
    user: "1000:1000"
    volumes: # The order matters! Make sure the downloads is first in the volume list or it will not work!
      - ${MEDIA_DIR}/Manga:/home/suwayomi/.local/share/Tachidesk
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UID=1000
      - GID=1000
      - TZ=Europe/Paris


  syncyomi:
    container_name: syncyomi
    image: ghcr.io/syncyomi/syncyomi:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    volumes:
      - ${CONFIG_DIR}/syncyomi/config:/config

  # UK-EXIT VPN — dedicated for BBC iPlayer and other UK-region content.
  # Separate from the main gluetun (Switzerland) which routes Transmission.
  gluetun-uk:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-uk
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_UK_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${MULLVAD_UK_WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=UK
      - FIREWALL_INPUT_PORTS=1935,4404
      - FIREWALL_OUTBOUND_SUBNETS=172.18.0.0/16  # allow containers behind this VPN to reach the Docker network (for Sonarr API)
      - TZ=Europe/Paris
      - LOG_LEVEL=info
      - DOT=off
      - DNS_ADDRESS=1.1.1.1
    ports:
      - 1935:1935/tcp        # get_iplayer web UI (routed via this gluetun)
    restart: unless-stopped

  # BBC iPlayer downloader — routes through gluetun-uk so it appears to be in the UK.
  # Retained for manual use; the primary Sonarr-integrated path is iplayarr below.
  get_iplayer:
    image: thespad/get_iplayer:latest
    container_name: get_iplayer
    labels:
      plugsy.name: "get_iplayer (backend)"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/simple-icons/Bbciplayer"
      plugsy.link: https://backend.iplayer.thenairn.com
    network_mode: "service:gluetun-uk"
    depends_on:
      - gluetun-uk
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Paris
    volumes:
      - ${CONFIG_DIR}/get_iplayer:/config
      - ${DOWNLOADS_DIR}/iplayer:/downloads
    restart: unless-stopped

  # Sonarr/Radarr-facing bridge over iPlayer. Presents as a Newznab indexer + SABnzbd
  # download client; uses its own bundled get_iplayer under the hood.
  iplayarr:
    image: nikorag/iplayarr:latest
    container_name: iplayarr
    labels:
      plugsy.name: "iPlayer"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/simple-icons/Bbciplayer"
      plugsy.link: https://iplayer.thenairn.com
    network_mode: "service:gluetun-uk"
    depends_on:
      - gluetun-uk
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Paris
      - API_KEY=${IPLAYARR_API_KEY}
      - AUTH_TYPE=none   # built-in login disabled; Caddy admin OAuth gates external access
      - DOWNLOAD_DIR=/data/incomplete
      - COMPLETE_DIR=/data/complete
    volumes:
      - ${CONFIG_DIR}/iplayarr/config:/config
      - ${CONFIG_DIR}/iplayarr/logs:/logs
      - ${CONFIG_DIR}/iplayarr/cache:/cache
      - ${DOWNLOADS_DIR}/iplayarr:/data
    restart: unless-stopped

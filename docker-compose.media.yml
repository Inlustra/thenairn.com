services:
  # VPN PROXY - All torrent traffic routes through here
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${MULLVAD_WIREGUARD_ADDRESSES}
      - FIREWALL_VPN_INPUT_PORTS=51413
      - FIREWALL_INPUT_PORTS=9091
      - HTTPPROXY=on
      - SERVER_CITIES=Zurich  # Change to your preferred Mullvad location
      - TZ=Europe/Paris
      - LOG_LEVEL=info
    ports:
      # Transmission ports (now exposed via gluetun)
      - 51413:51413/tcp      # Transmission peer port
      - 51413:51413/udp      # Transmission peer port
      # Gluetun control/proxy ports (optional)
      - 8888:8888/tcp        # HTTP proxy
      - 8388:8388/tcp        # Shadowsocks
      - 8388:8388/udp        # Shadowsocks
    restart: unless-stopped

  plex:
    runtime: nvidia
    container_name: plex
    labels:
      plugsy.name: "Plex"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/simple-icons/Plex"
      plugsy.link: https://plex.thenairn.com
    image: plexinc/pms-docker:latest
    hostname: Artemis
    logging:
        driver: "json-file"
        options:
            max-size: "3m"
    environment:
      - TZ=Europe/Paris
      # - PLEX_CLAIM=${PLEX_CLAIM}
      - ADVERTISE_IP=${PLEX_ADVERTISE_IP}
      - NVIDIA_VISIBLE_DEVICES=GPU-c1d14a88-b2fa-5786-e47d-64af7a34ea34
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PLEX_UID=0
      - PLEX_GID=0
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    volumes:
      - /tmp:/transcode
      - ${CONFIG_DIR}/plex:/config
      - ${AMEDIA_DIR}/A:/data/ashows
      - ${MEDIA_DIR}/Shows:/data/shows
      - ${MEDIA_DIR}/Movies:/data/movies
      - ${MEDIA_DIR}/Anime:/data/anime
      - ${MEDIA_DIR}/AnimeMovies:/data/animemovies
      - ${MEDIA_DIR}/Audiobooks:/data/audiobooks
      - ${PERSONAL_MEDIA_DIR}/:/data/personal
    restart: unless-stopped

  # TORRENT CLIENT - Now routes through gluetun VPN
  transmission:
    container_name: transmission
    image: linuxserver/transmission:latest
    network_mode: "service:gluetun"  # All traffic goes through gluetun VPN
    sysctls:
      - "net.ipv6.conf.all.disable_ipv6=0"
    volumes:
      - ${DOWNLOADS_DIR}/incomplete:/data/downloads
      - ${DOWNLOADS_DIR}/completed:/data/completed
      - ${CONFIG_DIR}/transmission:/config
      - ${DOWNLOADS_DIR}:/data
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Paris
      - TRANSMISSION_WEB_UI=/flood-for-transmission  # Preserves flood UI
      # Removed: All OPENVPN_* vars (VPN now handled by gluetun)
      # Removed: WEBPROXY_* vars (not needed)
    depends_on:
      - gluetun
    restart: always

  sonarr:
    container_name: sonarr
    labels:
      plugsy.name: "Sonarr"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/feather/Tv"
      plugsy.link: https://sonarr.thenairn.com
    image: linuxserver/sonarr:latest
    depends_on:
      - transmission
    links:
      - plex
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${MEDIA_DIR}/Shows:/tv
      - ${AMEDIA_DIR}/A:/amedia
      - ${DOWNLOADS_DIR}:/data
    environment:
      - PGID=0
      - PUID=0
      - TZ=Europe/Paris
    restart: unless-stopped

  animesonarr:
    container_name: animesonarr
    labels:
      plugsy.name: "Anime Sonarr"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/feather/Tv"
      plugsy.link: https://animesonarr.thenairn.com
    image: linuxserver/sonarr:develop
    depends_on:
      - transmission
    links:
      - plex
    volumes:
      - ${CONFIG_DIR}/sonarr_anime:/config
      - ${MEDIA_DIR}/Anime:/anime
      - ${AMEDIA_DIR}/A:/amedia
      - ${DOWNLOADS_DIR}:/data
    environment:
      - PGID=0
      - PUID=0
      - TZ=Europe/Paris
    restart: unless-stopped

  radarr:
    container_name: radarr
    labels:
      plugsy.name: "Radarr"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/feather/Film"
      plugsy.link: https://radarr.thenairn.com
    image: linuxserver/radarr
    depends_on:
      - transmission
    links:
      - plex
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${MEDIA_DIR}/Movies:/movies
      - ${MEDIA_DIR}/Anime:/anime
      - ${DOWNLOADS_DIR}:/data
    environment:
      - PGID=0
      - PUID=0
      - TZ=Europe/Paris
    restart: unless-stopped
  
  animeradarr:
    container_name: animeradarr
    labels:
      plugsy.name: "Anime Radarr"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/feather/Film"
      plugsy.link: https://animeradarr.thenairn.com
    image: linuxserver/radarr
    depends_on:
      - transmission
    links:
      - plex
    volumes:
      - ${CONFIG_DIR}/animeradarr:/config
      - ${MEDIA_DIR}/AnimeMovies:/movies
      - ${DOWNLOADS_DIR}:/data
    environment:
      - PGID=0
      - PUID=0
      - TZ=Europe/Paris
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr
    container_name: overseerr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Paris
    links:
      - sonarr
      - radarr
    volumes:
      - ${CONFIG_DIR}/overseer:/config
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/linuxserver/prowlarr:develop
    environment:
      PUID: 0
      PGID: 0
      TZ: Europe/London
    labels:
      plugsy.name: "Prowlarr"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/fluentui-system-filled/GlobeSearch"
      plugsy.link: https://prowlarr.thenairn.com
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    restart: unless-stopped
    links:
      - sonarr
      - radarr
      - transmission
    
  # CAPTCHA SOLVER - Now routes through gluetun VPN
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"  # Changed from service:transmission
    depends_on:
      - gluetun
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/London
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    user: 0:0
    volumes:
      - ./recyclarr:/config
    environment:
      - TZ=Europe/Paris

  maintainerr:
    image: jorenn92/maintainerr:latest # or ghcr.io/jorenn92/maintainerr:latest
    container_name: maintainerr
    volumes:
      - ${CONFIG_DIR}/maintainerr:/opt/data
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped

  plex-meta-manager:
    image: lscr.io/linuxserver/kometa:latest
    container_name: kometa
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - PMM_CONFIG=/config/config.yml #optional
      - PMM_TIME=03:00 #optional
      - PMM_RUN=TRUE #optional
      - PMM_TEST=False #optional
      - PMM_NO_MISSING=False #optional
    volumes:
      - ${CONFIG_DIR}/plex-meta-manager:/config
    restart: unless-stopped

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:preview
    container_name: suwayomi
    user: "1000:1000"
    volumes: # The order matters! Make sure the downloads is first in the volume list or it will not work!
      - ${MEDIA_DIR}/Manga:/home/suwayomi/.local/share/Tachidesk
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UID=1000
      - GID=1000
      - TZ=Europe/Paris


  syncyomi:
    container_name: syncyomi
    image: ghcr.io/syncyomi/syncyomi:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    volumes:
      - ${CONFIG_DIR}/syncyomi/config:/config

  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    labels:
      plugsy.name: "File Browser"
      plugsy.category: "Media"
      plugsy.icon: "@styled-icons/feather/Folder"
      plugsy.link: https://files.thenairn.com
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Paris
    volumes:
      - ${CONFIG_DIR}/metube/cookies:/srv/cookies:rw
      - ${CONFIG_DIR}/filebrowser:/config
      - ${CONFIG_DIR}/filebrowser/database:/database
    restart: unless-stopped
